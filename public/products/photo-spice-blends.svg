<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#581c87"/>
  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Gourmet Spice Bowl -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="270" r="170" fill="#6b21a8" stroke="#c084fc" stroke-width="5"/>
    <circle cx="400" cy="270" r="145" fill="#121212"/>
    
    <!-- Spice Mounds -->
    <circle cx="360" cy="250" r="70" fill="#c084fc" opacity="0.85"/>
    <circle cx="440" cy="260" r="65" fill="#e9d5ff" opacity="0.85"/>
    <circle cx="400" cy="300" r="60" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Spec Tag -->
  <g transform="translate(400, 415)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#000000" fill-opacity="0.75" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#e9d5ff" letter-spacing="1" text-anchor="middle">Garam Masala, Biryani & Sambar Blends</text>
  </g>

  <!-- Title Card -->
  <rect x="80" y="455" width="640" height="110" rx="20" fill="#09090b" fill-opacity="0.92" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" filter="url(#shadow)"/>
  <text x="400" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Indian Spice Blends</text>
  <text x="400" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e9d5ff" letter-spacing="1.5" text-anchor="middle">VISHRA GLOBAL EXPORTS • PREMIUM QUALITY</text>
</svg>