<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3f2305"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#3f2305"/>
  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Gourmet Rice Bowl -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="270" r="170" fill="#543310" stroke="#b45309" stroke-width="5"/>
    <circle cx="400" cy="270" r="145" fill="#121212"/>
    
    <!-- Rice Mound -->
    <ellipse cx="400" cy="270" rx="130" ry="110" fill="#d97706" opacity="0.9"/>
    <circle cx="360" cy="240" r="50" fill="#ffffff" opacity="0.3"/>
    <circle cx="440" cy="280" r="40" fill="#fef3c7" opacity="0.5"/>
  </g>

  <!-- Spec Tag -->
  <g transform="translate(400, 415)">
    <rect x="-160" y="-15" width="320" height="30" rx="15" fill="#000000" fill-opacity="0.8" stroke="#fef3c7" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fef3c7" letter-spacing="1" text-anchor="middle">Unpolished Basmati, Sona Masuri & Ponni</text>
  </g>

  <!-- Title Card -->
  <rect x="80" y="455" width="640" height="110" rx="20" fill="#09090b" fill-opacity="0.92" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" filter="url(#shadow)"/>
  <text x="400" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Whole Grain Brown Rice</text>
  <text x="400" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fef3c7" letter-spacing="1.5" text-anchor="middle">VISHRA GLOBAL EXPORTS • PREMIUM RICE</text>
</svg>