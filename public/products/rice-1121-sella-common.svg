<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Bowl -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="300" rx="240" ry="140" fill="#0f0f10" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.4"/>
    <ellipse cx="400" cy="295" rx="220" ry="120" fill="#18181b"/>
    <ellipse cx="400" cy="285" rx="190" ry="95" fill="#f8fafc" opacity="0.95"/>
  </g>

  <!-- Badge -->
  <g transform="translate(400, 70)">
    <rect x="-110" y="-20" width="220" height="40" rx="20" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="2" text-anchor="middle">1121 GOLDEN SELLA</text>
  </g>

  <!-- Title Card -->
  <rect x="120" y="440" width="560" height="110" rx="18" fill="#09090b" fill-opacity="0.85" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" filter="url(#shadow)"/>
  <text x="400" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">1121 Golden Sella Basmati</text>
  <text x="400" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#fbbf24" letter-spacing="1" text-anchor="middle">Golden Parboiled Extra Long Basmati</text>
</svg>