<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Ice bed effect -->
  <ellipse cx="400" cy="300" rx="260" ry="140" fill="#38bdf8" fill-opacity="0.15" filter="url(#shadow)"/>
  <ellipse cx="400" cy="295" rx="230" ry="120" fill="#0284c7" fill-opacity="0.2"/>

  <!-- Raw Seafood graphic -->
  <g filter="url(#shadow)">
    <!-- Raw Shrimp / Fish motif -->
    <path d="M280 280 C320 200, 480 200, 520 280 C480 340, 320 340, 280 280 Z" fill="#e2e8f0" fill-opacity="0.9"/>
    <path d="M520 280 L560 250 L560 310 Z" fill="#ef4444"/>
    <!-- Ice crystals -->
    <circle cx="340" cy="270" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="440" cy="310" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="400" cy="250" r="5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Badge -->
  <g transform="translate(400, 70)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="2" text-anchor="middle">RAW SKEWERS</text>
  </g>

  <!-- Title Card -->
  <rect x="120" y="440" width="560" height="110" rx="18" fill="#09090b" fill-opacity="0.85" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" filter="url(#shadow)"/>
  <text x="400" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Raw Shrimp Skewers</text>
  <text x="400" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#38bdf8" letter-spacing="1" text-anchor="middle">Raw Tail-On Shrimp on Bamboo Skewers</text>
</svg>