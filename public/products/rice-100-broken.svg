<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="240" r="300" fill="url(#glow)"/>

  <!-- Bowl / Plate graphics -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="300" rx="240" ry="140" fill="#0f0f10" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.4"/>
    <ellipse cx="400" cy="295" rx="220" ry="120" fill="#18181b"/>
  </g>

  <!-- Rice Grains Illustration -->
  <g filter="url(#shadow)" opacity="0.95">
    <!-- Center heap -->
    <ellipse cx="400" cy="285" rx="190" ry="95" fill="#cbd5e1" opacity="0.9"/>
    
    <!-- Individual grain details -->
    <ellipse cx="380" cy="260" rx="14" ry="4" fill="#ffffff" transform="rotate(-15 380 260)"/>
    <ellipse cx="420" cy="270" rx="16" ry="5" fill="#ffffff" transform="rotate(20 420 270)"/>
    <ellipse cx="350" cy="280" rx="15" ry="4.5" fill="#ffffff" transform="rotate(-30 350 280)"/>
    <ellipse cx="440" cy="285" rx="18" ry="5" fill="#ffffff" transform="rotate(10 440 285)"/>
    <ellipse cx="390" cy="295" rx="15" ry="4" fill="#ffffff" transform="rotate(5 390 295)"/>
    <ellipse cx="330" cy="290" rx="14" ry="4" fill="#ffffff" transform="rotate(-25 330 290)"/>
    <ellipse cx="460" cy="295" rx="16" ry="4.5" fill="#ffffff" transform="rotate(35 460 295)"/>
    <ellipse cx="365" cy="310" rx="15" ry="4" fill="#ffffff" transform="rotate(-10 365 310)"/>
    <ellipse cx="425" cy="315" rx="17" ry="5" fill="#ffffff" transform="rotate(15 425 315)"/>
  </g>

  <!-- Export Badge -->
  <g transform="translate(400, 70)">
    <rect x="-110" y="-20" width="220" height="40" rx="20" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="2" text-anchor="middle">100% BROKEN</text>
  </g>

  <!-- Title & Subtitle Card -->
  <rect x="120" y="440" width="560" height="110" rx="18" fill="#09090b" fill-opacity="0.85" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" filter="url(#shadow)"/>
  <text x="400" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">100% Broken White Rice</text>
  <text x="400" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="1" text-anchor="middle">Double Polished Processing Grade</text>
</svg>