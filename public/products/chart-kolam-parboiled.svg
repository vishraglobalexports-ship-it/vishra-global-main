<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Bowl representation matching export chart -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="270" r="160" fill="#2d2218" stroke="#d97706" stroke-width="4"/>
    <circle cx="400" cy="270" r="142" fill="#1c120c"/>
    <ellipse cx="400" cy="265" rx="130" ry="110" fill="#fef08a" opacity="0.95"/>
    
    <!-- Individual grain textures -->
    <ellipse cx="370" cy="240" rx="14" ry="4" fill="#ffffff" transform="rotate(-15 370 240)"/>
    <ellipse cx="420" cy="250" rx="16" ry="5" fill="#ffffff" transform="rotate(20 420 250)"/>
    <ellipse cx="350" cy="270" rx="15" ry="4.5" fill="#ffffff" transform="rotate(-30 350 270)"/>
    <ellipse cx="440" cy="275" rx="18" ry="5" fill="#ffffff" transform="rotate(10 440 275)"/>
  </g>

  <!-- Category Badge -->
  <g transform="translate(400, 50)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#f97316" letter-spacing="2" text-anchor="middle">3. PARBOILED RICE</text>
  </g>

  <!-- Length Tag -->
  <g transform="translate(400, 415)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#000000" fill-opacity="0.6" stroke="#f97316" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">Length: 5.20 mm</text>
  </g>

  <!-- Title Card -->
  <rect x="100" y="450" width="600" height="110" rx="18" fill="#09090b" fill-opacity="0.9" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" filter="url(#shadow)"/>
  <text x="400" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Kolam Parboiled</text>
  <text x="400" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f97316" letter-spacing="1" text-anchor="middle">Parboiled Rice • India Export Specification</text>
</svg>